<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner Landing | Antigravity QR</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .viewer-container {
      max-width: 600px;
      margin: 2.5rem auto;
      padding: 0 1rem;
      position: relative;
      z-index: 10;
    }

    .viewer-card {
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-xl);
      padding: 2.25rem;
      backdrop-filter: var(--glass-blur-lg);
      box-shadow: var(--shadow-lg);
      text-align: center;
      transition: all var(--transition-normal);
    }

    .viewer-media-box {
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 1.5rem;
      background: #000;
      border: 1px solid var(--border-subtle);
    }

    .viewer-media-box img,
    .viewer-media-box video {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
    }

    .viewer-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .viewer-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .viewer-scan-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 0.35rem 0.85rem;
      border-radius: var(--radius-full);
      margin-bottom: 1.25rem;
    }

    .viewer-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn-viewer-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.9rem 1.5rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      text-decoration: none;
      transition: all var(--transition-normal);
      cursor: pointer;
    }

    .btn-viewer-primary {
      background: var(--primary);
      color: white;
      border: none;
      box-shadow: var(--shadow-glow);
    }

    .btn-viewer-primary:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    /* Dynamic Redirect Splash Screen */
    .redirect-box {
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .redirect-spinner-circle {
      width: 56px;
      height: 56px;
      border: 4px solid var(--border-medium);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .redirect-destination {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.65rem 1rem;
      font-family: monospace;
      font-size: 0.88rem;
      color: var(--primary);
      word-break: break-all;
      margin: 0.75rem 0 1.25rem;
      max-width: 100%;
    }
  </style>
</head>

<body>
  <!-- Ambient background -->
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <div class="viewer-container">
    <div class="viewer-card" id="viewer-card">
      <div id="loading-spinner" style="padding: 3rem 0; color: var(--text-secondary);">
        <div class="redirect-spinner-circle" style="margin: 0 auto 1rem;"></div>
        <p>Memverifikasi kode QR & merekam analitik...</p>
      </div>

      <!-- Redirect Screen for Dynamic Link QRs -->
      <div id="redirect-container" class="redirect-box" style="display: none;">
        <div class="redirect-spinner-circle"></div>
        <div id="redirect-scan-badge" class="viewer-scan-badge">✓ Pemindaian berhasil dicatat</div>
        <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.25rem;">Mengarahkan ke Tujuan...</h2>
        <div id="redirect-target-url" class="redirect-destination"></div>
        <a id="btn-redirect-manual" href="#" class="btn-viewer-action btn-viewer-primary">
          Buka Tautan Langsung ↗
        </a>
      </div>

      <!-- Media Showcase Screen for Photo/Video QRs -->
      <div id="content-container" style="display: none;">
        <div id="scan-pill" class="viewer-scan-badge"></div>
        <div class="viewer-media-box" id="media-box"></div>
        <h1 class="viewer-title" id="media-title">Media Showcase</h1>
        <p class="viewer-desc" id="media-desc"></p>
        <div class="viewer-actions" id="viewer-actions"></div>
      </div>
    </div>
  </div>

  <!-- Firebase & Storage SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/firebase-config.js?v=3.9"></script>
  <script src="../assets/js/storage.js?v=3.9"></script>
  <script src="viewer.js?v=3.9"></script>
</body>

</html>
